<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Sports Betting Bot 9000</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">🎰</span>
        <div>
          <h1>Super Sports Betting Bot <span class="accent">9000</span></h1>
          <p class="tagline">Sports picks &amp; parlay helper</p>
        </div>
      </div>
      <button id="suggest-btn" class="btn btn-accent">Suggest best parlay</button>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>Today's picks</h2>
        <p class="hint">Click a pick to add it to your slip. Edge = model confidence − market implied probability.</p>
        <div id="picks" class="picks"></div>
      </section>

      <section class="panel slip">
        <h2>Bet slip</h2>
        <div id="slip" class="slip-list">
          <p class="empty">No legs yet — add picks from the left.</p>
        </div>

        <div class="stake-row">
          <label for="stake">Stake ($)</label>
          <input id="stake" type="number" min="1" step="1" value="10" />
        </div>

        <div id="result" class="result hidden">
          <div class="result-grid">
            <div><span class="k">Legs</span><span id="r-legs" class="v"></span></div>
            <div><span class="k">Combined odds</span><span id="r-american" class="v"></span></div>
            <div><span class="k">Decimal</span><span id="r-decimal" class="v"></span></div>
            <div><span class="k">Implied win %</span><span id="r-prob" class="v"></span></div>
            <div><span class="k">Payout</span><span id="r-payout" class="v big"></span></div>
            <div><span class="k">Profit</span><span id="r-profit" class="v big accent"></span></div>
          </div>
        </div>
        <p id="error" class="error hidden"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
